data:
  client_dirs:
    - data_smoke/client1
    - data_smoke/client2
    - data_smoke/client3
  image_size: 128

model:
  in_channels: 1
  out_channels: 1
  features: [16, 32, 64, 128]

training:
  local_epochs: 1
  batch_size: 1
  learning_rate: 0.001

federated:
  num_rounds: 1
  fraction_fit: 1.0
  fraction_evaluate: 1.0

output:
  model_save_dir: results/checkpoints_3clients_smoke
  results_dir: results_3clients_smoke/
