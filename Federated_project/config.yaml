# ── Data ─────────────────────────────────────────────────────────────────────
data:
  # Each entry is a prepared client directory (output of prepare_*.py scripts)
  client_dirs:
    - data/client1   # INbreast
    - data/client2   # CBIS-DDSM
    - data/client3   # MIAS
  image_size: 256    # resize all images to this square

# ── Model ────────────────────────────────────────────────────────────────────
model:
  in_channels: 1
  out_channels: 1
  features: [32, 64, 128, 256]

# ── Local training (per client per round) ────────────────────────────────────
training:
  local_epochs: 3
  batch_size: 2
  learning_rate: 0.001

# ── Federated learning ───────────────────────────────────────────────────────
federated:
  num_rounds: 10
  fraction_fit: 1.0
  fraction_evaluate: 1.0

# ── Output ───────────────────────────────────────────────────────────────────
output:
  model_save_dir: results/checkpoints
  results_dir: results/
