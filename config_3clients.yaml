data:
  client_dirs:
    - data/client1   # INbreast
    - data/client2   # CBIS-DDSM
    - data/client3   # MIAS
  image_size: 256

model:
  in_channels: 1
  out_channels: 1
  features: [32, 64, 128, 256]

training:
  local_epochs: 3
  batch_size: 2
  learning_rate: 0.001

federated:
  num_rounds: 4
  fraction_fit: 1.0
  fraction_evaluate: 1.0

output:
  model_save_dir: results/checkpoints_3clients
  results_dir: results_3clients/
